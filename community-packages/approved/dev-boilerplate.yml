name: "Developer Boilerplate"
version: "1.0.0"
author: "snipsidian-community"
license: "MIT"
description: "Inline code shortcuts for JS/TS/Python — log lines, function shells, try-catch, type guards. Wrap your snippet in a code fence to keep markdown happy."
category: "development"
tags: ["javascript", "typescript", "python", "boilerplate"]

snippets:
  # JavaScript / TypeScript
  - trigger: "tslog"
    replace: "console.log($|);"
  - trigger: "tsdbg"
    replace: "console.log(\"$1 →\", $|);"
  - trigger: "tserr"
    replace: "console.error($|);"
  - trigger: "fnct"
    replace: "function $1($2) {\n  $|\n}"
  - trigger: "afn"
    replace: "($1) => $|"
  - trigger: "afnb"
    replace: "($1) => {\n  $|\n}"
  - trigger: "async"
    replace: "async ($1) => {\n  $|\n}"
  - trigger: "tryc"
    replace: "try {\n  $|\n} catch (err) {\n  console.error(err);\n}"
  - trigger: "iife"
    replace: "(() => {\n  $|\n})();"

  # Type guards / TS
  - trigger: "iface"
    replace: "interface $1 {\n  $|\n}"
  - trigger: "tdef"
    replace: "type $1 = $|"
  - trigger: "isstr"
    replace: "function is$1(value: unknown): value is $1 {\n  return typeof value === \"string\" && $|;\n}"

  # Python
  - trigger: "pyfn"
    replace: "def $1($2):\n    \"\"\"$|\"\"\"\n    "
  - trigger: "pyclass"
    replace: "class $1:\n    def __init__(self, $2):\n        $|"
  - trigger: "pyimp"
    replace: "from $1 import $|"
  - trigger: "pylog"
    replace: "print(f\"$1 = {$|}\")"
  - trigger: "pdb"
    replace: "import pdb; pdb.set_trace()  # $|"
  - trigger: "pytry"
    replace: "try:\n    $|\nexcept $1 as e:\n    "
  - trigger: "ifmain"
    replace: "if __name__ == \"__main__\":\n    $|"

  # Shell / git
  - trigger: "shbang"
    replace: "#!/usr/bin/env $|"
  - trigger: "gitco"
    replace: "$ git commit -m \"$|\""
