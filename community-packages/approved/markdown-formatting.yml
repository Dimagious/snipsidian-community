name: "Markdown Formatting"
version: "1.0.0"
author: "snipsidian-community"
description: "Essential markdown formatting shortcuts for quick text styling and structure"
category: "formatting"
tags: ["markdown", "formatting", "text", "structure", "popular"]

snippets:
  # Headers
  "#h1": "# "
  "#h2": "## "
  "#h3": "### "
  "#h4": "#### "
  "#h5": "##### "
  "#h6": "###### "

  # Text formatting
  "**bold**": "**bold text**"
  "*italic*": "*italic text*"
  "~~strike~~": "~~strikethrough text~~"
  "`code`": "`inline code`"
  "```block```": "```\ncode block\n```"
  "```js": "```javascript\n\n```"
  "```py": "```python\n\n```"
  "```html": "```html\n\n```"
  "```css": "```css\n\n```"
  "```json": "```json\n\n```"

  # Lists
  "-list": "- "
  "*list": "* "
  "+list": "+ "
  "1.list": "1. "
  "2.list": "2. "
  "3.list": "3. "
  "- [ ]": "- [ ] "
  "- [x]": "- [x] "

  # Links and media
  "[link]": "[link text](url)"
  "[!img]": "![alt text](image-url)"
  "[!video]": "![video](video-url)"
  "[!audio]": "![audio](audio-url)"
  "[!pdf]": "![pdf](pdf-url)"
  "[!doc]": "![document](doc-url)"

  # Tables
  "|table|": "| Column 1 | Column 2 | Column 3 |\n|----------|----------|----------|\n| Row 1    | Data 1   | Data 2   |\n| Row 2    | Data 3   | Data 4   |"
  "|3col|": "| Col 1 | Col 2 | Col 3 |\n|-------|-------|-------|\n|       |       |       |"
  "|2col|": "| Col 1 | Col 2 |\n|-------|-------|\n|       |       |"

  # Horizontal rules and breaks
  "---": "---"
  "***": "***"
  "___": "___"
  "<br>": "<br>"
  "<br/>": "<br/>"

  # Blockquotes
  ">quote": "> "
  ">>quote": ">> "
  ">>>quote": ">>> "

  # Mathematical expressions
  "$inline$": "$inline math$"
  "$$block$$": "$$\nblock math\n$$"
  "\\frac": "\\frac{numerator}{denominator}"
  "\\sum": "\\sum_{i=1}^{n}"
  "\\int": "\\int_{a}^{b}"

  # Special characters
  "&nbsp;": "&nbsp;"
  "&amp;": "&amp;"
  "&lt;": "&lt;"
  "&gt;": "&gt;"
  "&quot;": "&quot;"
  "&copy;": "&copy;"
  "&reg;": "&reg;"
  "&trade;": "&trade;"

  # Common symbols
  "->": "→"
  "<-": "←"
  "=>": "⇒"
  "<=": "⇐"
  "!=": "≠"
  "<=": "≤"
  ">=": "≥"
  "+-": "±"
  "x2": "²"
  "x3": "³"
  "1/2": "½"
  "1/4": "¼"
  "3/4": "¾"

  # Footnotes
  "[^1]": "[^1]"
  "[^note]": "[^note]"
  "^def": "^[1]: Footnote definition"
