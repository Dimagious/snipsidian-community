name: "Markdown Formatting"
version: "1.0.0"
author: "snipsidian-community"
description: "Essential markdown formatting shortcuts for quick text styling and structure"
category: "formatting"
tags: ["markdown", "formatting", "text", "structure", "popular"]

snippets:
  - trigger: "#h1"
    replace: "# "
  - trigger: "#h2"
    replace: "## "
  - trigger: "#h3"
    replace: "### "
  - trigger: "#h4"
    replace: "#### "
  - trigger: "#h5"
    replace: "##### "
  - trigger: "#h6"
    replace: "###### "
  - trigger: "**bold**"
    replace: "**bold text**"
  - trigger: "*italic*"
    replace: "*italic text*"
  - trigger: "~~strike~~"
    replace: "~~strikethrough text~~"
  - trigger: "`code`"
    replace: "`inline code`"
  - trigger: "```block```"
    replace: "```\ncode block\n```"
  - trigger: "```js"
    replace: "```javascript\n\n```"
  - trigger: "```py"
    replace: "```python\n\n```"
  - trigger: "```html"
    replace: "```html\n\n```"
  - trigger: "```css"
    replace: "```css\n\n```"
  - trigger: "```json"
    replace: "```json\n\n```"
  - trigger: "-list"
    replace: "- "
  - trigger: "*list"
    replace: "* "
  - trigger: "+list"
    replace: "+ "
  - trigger: "1.list"
    replace: "1. "
  - trigger: "2.list"
    replace: "2. "
  - trigger: "3.list"
    replace: "3. "
  - trigger: "- [ ]"
    replace: "- [ ] "
  - trigger: "- [x]"
    replace: "- [x] "
  - trigger: "[link]"
    replace: "[link text](url)"
  - trigger: "[!img]"
    replace: "![alt text](image-url)"
  - trigger: "[!video]"
    replace: "![video](video-url)"
  - trigger: "[!audio]"
    replace: "![audio](audio-url)"
  - trigger: "[!pdf]"
    replace: "![pdf](pdf-url)"
  - trigger: "[!doc]"
    replace: "![document](doc-url)"
  - trigger: "|table|"
    replace: "| Column 1 | Column 2 | Column 3 |\n|----------|----------|----------|\n| Row 1    | Data 1   | Data 2   |\n| Row 2    | Data 3   | Data 4   |"
  - trigger: "|3col|"
    replace: "| Col 1 | Col 2 | Col 3 |\n|-------|-------|-------|\n|       |       |       |"
  - trigger: "|2col|"
    replace: "| Col 1 | Col 2 |\n|-------|-------|\n|       |       |"
  - trigger: "---"
    replace: "---"
  - trigger: "***"
    replace: "***"
  - trigger: "___"
    replace: "___"
  - trigger: "<br>"
    replace: "<br>"
  - trigger: "<br/>"
    replace: "<br/>"
  - trigger: ">quote"
    replace: "> "
  - trigger: ">>quote"
    replace: ">> "
  - trigger: ">>>quote"
    replace: ">>> "
  - trigger: "$inline$"
    replace: "$inline math$"
  - trigger: "$$block$$"
    replace: "$$\nblock math\n$$"
  - trigger: "\\frac"
    replace: "\\frac{numerator}{denominator}"
  - trigger: "\\sum"
    replace: "\\sum_{i=1}^{n}"
  - trigger: "\\int"
    replace: "\\int_{a}^{b}"
  - trigger: "&nbsp;"
    replace: "&nbsp;"
  - trigger: "&amp;"
    replace: "&amp;"
  - trigger: "&lt;"
    replace: "&lt;"
  - trigger: "&gt;"
    replace: "&gt;"
  - trigger: "&quot;"
    replace: "&quot;"
  - trigger: "&copy;"
    replace: "&copy;"
  - trigger: "&reg;"
    replace: "&reg;"
  - trigger: "&trade;"
    replace: "&trade;"
  - trigger: "->"
    replace: "→"
  - trigger: "<-"
    replace: "←"
  - trigger: "=>"
    replace: "⇒"
  - trigger: "<=less"
    replace: "≤"
  - trigger: "!=not"
    replace: "≠"
  - trigger: ">=more"
    replace: "≥"
  - trigger: "+-"
    replace: "±"
  - trigger: "x2"
    replace: "²"
  - trigger: "x3"
    replace: "³"
  - trigger: "1/2"
    replace: "½"
  - trigger: "1/4"
    replace: "¼"
  - trigger: "3/4"
    replace: "¾"
  - trigger: "[^1]"
    replace: "[^1]"
  - trigger: "[^note]"
    replace: "[^note]"
  - trigger: "^def"
    replace: "^[1]: Footnote definition"