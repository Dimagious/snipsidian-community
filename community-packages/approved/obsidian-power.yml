name: "Obsidian Power-User"
version: "1.0.0"
author: "snipsidian-community"
license: "MIT"
description: "Dataview blocks, frontmatter scaffolds, query templates — everything that takes Obsidian beyond plain markdown."
category: "obsidian"
tags: ["obsidian", "dataview", "frontmatter", "advanced"]

snippets:
  # Frontmatter
  - trigger: "fmm"
    replace: "---\ntitle: $1\ndate: $date\ntags: []\nstatus: $|\n---\n"
  - trigger: "fmtags"
    replace: "tags:\n  - $|"
  - trigger: "fmaliases"
    replace: "aliases:\n  - $|"

  # Dataview
  - trigger: "dvb"
    replace: "```dataview\n$|\n```"
  - trigger: "dvjs"
    replace: "```dataviewjs\n$|\n```"
  - trigger: "dvtable"
    replace: "```dataview\ntable $1 from \"$2\"\nwhere $|\n```"
  - trigger: "dvlist"
    replace: "```dataview\nlist from #$1\nwhere $|\n```"
  - trigger: "dvtask"
    replace: "```dataview\ntask from \"$1\"\nwhere !completed\n```"

  # Embeds / transclusion
  - trigger: "embb"
    replace: "![[$|]]"
  - trigger: "embsec"
    replace: "![[$1#$|]]"
  - trigger: "embblk"
    replace: "![[$1^$|]]"
  - trigger: "blkref"
    replace: "^$|"

  # Internal navigation
  - trigger: "wlnk"
    replace: "[[$|]]"
  - trigger: "wlnkalias"
    replace: "[[$1|$|]]"
  - trigger: "wlnksec"
    replace: "[[$1#$|]]"
  - trigger: "tg"
    replace: "#$|"

  # Templater (works if Templater is installed)
  - trigger: "tplr"
    replace: "<% $| %>"
  - trigger: "tplrdate"
    replace: "<% tp.date.now(\"YYYY-MM-DD\") %>"
  - trigger: "tplrfile"
    replace: "<% tp.file.title %>"
