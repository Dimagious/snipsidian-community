  ">summary": "> [!summary]\n> \n> "
  ">tldr": "> [!tldr]\n> \n> "
  ">todo": "> [!todo]\n> \n> "
  ">check": "> [!check]\n> \n> "
  ">done": "> [!done]\n> \n> "
  ">question": "> [!question]\n> \n> "
  ">help": "> [!help]\n> \n> "
  ">faq": "> [!faq]\n> \n> "
