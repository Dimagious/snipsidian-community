name: "Obsidian Callouts"
version: "1.0.0"
author: "snipsidian-community"
description: "Quick shortcuts for creating Obsidian callout blocks with popular callout types"
category: "obsidian"
tags: ["obsidian", "callouts", "blocks", "formatting", "notes"]

snippets:
