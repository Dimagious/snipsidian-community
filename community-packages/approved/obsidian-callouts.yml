  ">note": "> [!note]\n> \n> "
  ">info": "> [!info]\n> \n> "
  ">tip": "> [!tip]\n> \n> "
  ">success": "> [!success]\n> \n> "
  ">warning": "> [!warning]\n> \n> "
  ">error": "> [!error]\n> \n> "
  ">danger": "> [!danger]\n> \n> "
  ">bug": "> [!bug]\n> \n> "
  ">example": "> [!example]\n> \n> "
  ">quote": "> [!quote]\n> \n> "

